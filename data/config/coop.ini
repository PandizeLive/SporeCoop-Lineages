; SporeCoop settings (copied to SporebinEP1/mods on first deploy)
[coop]
; your nickname shown to other players (any language; save this file as UTF-8 when you edit it)
name=Player
; host: send your current save to guests when they join (1/0)
share_world=1
; guest: load the host's world automatically when it arrives (1/0)
auto_load_world=1
; host: save the game before sending it, so guests start from the current state (1/0)
save_before_share=1
; host: save after campaign milestones or 10 minutes without a completed autosave (1/0)
autosave=1
; host: use smaller, spaced world packets on constrained links (1/0)
paced_world_transfer=0
; host: mirror NPC creatures to guests (1/0)
share_npcs=1
; host: NPC creatures near a partner treat that partner like your own creature (notice, chase, attack) (1/0)
npcs_target_partners=1
; how much the log says for problem reports: 0 = the old amount, 1 = a state line every 10 s and the
; players' actions (eating, bodies, votes, joins; about 1 MB per hour), 2 = verbose
log_detail=1

[report]
; when a problem is marked (/bug in the co-op chat, F9 "Report a problem"), a screenshot of the game
; is kept for the report file you send (mods\logs\shots, the newest 5); 0 = no screenshots (1/0)
screenshot=1

[campaign]
; New campaigns: extra military, religious and economic takeover effort per reserved founder.
; 5 means +5%, +10%, or +15% with two, three, or four seats at 100% Difficulty Scaling. The
; lobby's Difficulty Scaling multiplies it, like every other per-seat bonus (enemy health and
; damage, hunger, progress, Space raids). Saved campaigns keep their rules.
; This does not change purchase prices or income. 0 disables resistance.
takeover_per_extra_founder=5

[library]
; Lineages Cache, Foreign Creations (1/0): also receive the creations your partners got from other
; people, and let them appear in your worlds (Player Cells). Off: only your partners' own creations.
; The lobby button and `coop.library foreign on|off` change it too.
foreign_creations=0

[cell]
; Player Cells (1/0, host): your group's cells appear in the Cell stage as native creatures.
; The lobby button and `coop.lineagecells on|off` change it too.
lineage_cells=1
